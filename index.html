<style>
:root{--bg:#0d0d0d;--panel:#171717;--card:#1f1f1f;--line:#3a3a3a;--fg:#f2f2f2;--muted:#9a9a9a;--accent:#f2b92f;--accent-fg:#1a1200;--btn:#2e2e2e;--gold:#f2b92f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f2f2;--panel:#fff;--card:#f7f7f7;--line:#d4d4d4;--fg:#151515;--muted:#666;--accent:#b8860b;--accent-fg:#fff;--btn:#e4e4e4;--gold:#b8860b}}
:root[data-theme="dark"]{--bg:#0d0d0d;--panel:#171717;--card:#1f1f1f;--line:#3a3a3a;--fg:#f2f2f2;--muted:#9a9a9a;--accent:#f2b92f;--accent-fg:#1a1200;--btn:#2e2e2e;--gold:#f2b92f}
:root[data-theme="light"]{--bg:#f2f2f2;--panel:#fff;--card:#f7f7f7;--line:#d4d4d4;--fg:#151515;--muted:#666;--accent:#b8860b;--accent-fg:#fff;--btn:#e4e4e4;--gold:#b8860b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:grid;grid-template-columns:var(--sw) 1fr;min-height:100vh;--sw:230px;transition:grid-template-columns .2s}body.col{--sw:72px}
aside{padding:18px 14px;border-right:1px solid var(--line);position:sticky;top:0;height:100vh;overflow:auto}
.sub-tab{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--panel);border-radius:14px;padding:10px;margin-bottom:14px}
.logo{width:42px;height:42px;flex:none;object-fit:contain}
.sub-tab .t{flex:1;min-width:0}.sub-tab .t b{display:block;font-size:.95rem;line-height:1.2}.sub-tab .t small{display:block;margin-top:3px;font-size:.62rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--muted)}
.tog{border:0;background:var(--btn);color:var(--fg);border-radius:8px;width:32px;height:32px;cursor:pointer;font-size:1rem;flex:none}
.short{display:none}body.col .t,body.col .full,body.col .grp h4{display:none}body.col .short{display:inline}
body.col .sub-tab{flex-direction:column;padding:8px}body.col .logo{width:34px;height:34px}body.col .nav{text-align:center;padding:9px 4px}body.col aside{padding:14px 8px}
.grp{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:6px}
.grp h4{margin:6px 8px;font-size:.9rem}
.nav{display:block;width:100%;text-align:left;background:none;border:0;color:var(--muted);padding:9px 12px;border-radius:10px;font:inherit;font-size:.9rem;cursor:pointer}
.nav.on{background:var(--accent);color:var(--accent-fg);font-weight:600}
main{padding:20px;min-width:0;padding-bottom:210px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px}
h1{margin:0 0 4px;font-size:1.4rem}.sub{margin:0 0 14px;color:var(--muted);font-size:.9rem}
.tools{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:16px;background:var(--card)}
input[type=search]{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--fg);font:inherit;margin-bottom:10px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.chip{flex:none;border:1px solid var(--line);background:var(--btn);color:var(--fg);padding:5px 14px;border-radius:999px;font-size:.75rem;font-weight:700;text-transform:uppercase;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-fg)}
.chip.clr{background:transparent;border-color:var(--gold);color:var(--gold)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:16px;align-items:start}
.cat{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--card)}
.cat h3{filter:grayscale(1);margin:0 0 10px;font-size:.95rem;text-transform:uppercase;letter-spacing:.3px}
.line{border:1px dashed var(--line);border-radius:10px;margin-bottom:10px;overflow:hidden}
.head{display:flex;gap:6px;align-items:center;padding:8px;border-bottom:1px dashed var(--line);flex-wrap:wrap}
.sp{flex:1}
.id{background:var(--btn);color:var(--accent);border:1px solid var(--line);font-size:.7rem;font-weight:800;padding:4px 8px;border-radius:6px}
.b{border:0;background:var(--btn);color:var(--fg);font-size:.65rem;font-weight:800;text-transform:uppercase;padding:6px 9px;border-radius:6px;cursor:pointer}
.b:hover{filter:brightness(1.15)}.star.on{background:var(--accent);color:var(--accent-fg)}
.txt{padding:12px;cursor:pointer;font-size:.92rem}.txt:hover{background:color-mix(in srgb,var(--accent) 12%,transparent)}
.empty{color:var(--muted);padding:20px;text-align:center}
.draft{position:fixed;left:var(--sw);right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);padding:12px 20px calc(12px + env(safe-area-inset-bottom,0px))}
.draft textarea{width:100%;height:84px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--fg);font:inherit;padding:10px;resize:vertical}
.drow{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:.8rem;color:var(--muted)}
.drow .b{margin-left:6px;padding:7px 12px}.drow .main{background:var(--accent);color:var(--accent-fg)}
.toast{position:fixed;top:calc(16px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);background:var(--accent);color:var(--accent-fg);padding:9px 18px;border-radius:999px;font-weight:700;font-size:.85rem;opacity:0;pointer-events:none;transition:.2s;z-index:20}
.toast.show{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;padding:20px;z-index:15}
.modal.show{display:flex}
.box{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;max-width:520px;width:100%}
.box p{font-size:1.05rem;margin:10px 0 18px}
@media(max-width:760px){main{padding:14px 12px 210px}.draft{padding-left:12px;padding-right:12px}}
</style>
</head>

  <div class="grp"><h4>Opening and Closing</h4>
    <button class="nav on" data-p="opening"><span class="full">Opening</span><span class="short">Op</span></button>
    <button class="nav" data-p="closing"><span class="full">Closing</span><span class="short">Cl</span></button></div>
</aside>

<main>
  <div class="panel">
    <h1 id="title"></h1><p class="sub" id="desc"></p>
    <div class="tools">
      <input type="search" id="q" placeholder="Search by category or line...">
      <div class="chips" id="chips"></div>
    </div>
    <div class="cols" id="cols"></div>
  </div>
</main>

<div class="draft">
  <div class="drow"><span>Email draft: build it with Append / New Paragraph</span>
    <span><button class="b" id="clr">Clear</button><button class="b main" id="cpd">Copy draft</button></span></div>
  <textarea id="draft" placeholder="Your email draft builds here..."></textarea>
</div>

<div class="modal" id="modal"><div class="box"><b id="mid"></b><p id="mtxt"></p>
  <button class="b main" id="mcopy" style="background:var(--accent);color:var(--accent-fg);padding:9px 14px">Copy</button>
  <button class="b" id="mclose" style="padding:9px 14px">Close</button></div></div>
<div class="toast" id="toast">Copied!</div>

<script>
// Add or edit spiels here. Format: number: 'text'. The ID is built from the category code + number.
const DATA={
opening:{title:'Opening Spiels',desc:'All opening categories are visible. Click any line to copy your opening spiel. Select several category chips to open them side by side.',append:true,cats:[
 {k:'OP-INC',n:'Inconvenience',i:'⚠️',l:{1:'Please accept my sincere apologies for the inconvenience this shipment has caused you.',2:'Please accept my sincere apologies for the inconvenience this situation has caused.'}},
 {k:'OP-DLY',n:'Delay',i:'🕒',l:{1:'I apologize for the delay in my response.',2:'I apologize for the delay in providing you with an update.'}},
 {k:'OP-DLI',n:'Delay + Inconvenience',i:'⚠️',l:{1:'I sincerely apologize for the delay in my response and the inconvenience this shipment has caused you.',2:'I sincerely apologize for the delay in my update and the inconvenience this has caused.'}},
 {k:'OP-UNA',n:'Unable to Accommodate',i:'🚫',l:{1:'I apologize that I am unable to accommodate your request.',2:'I apologize that I am unable to accommodate this request at this time.'}},
 {k:'OP-DUA',n:'Delay + Unable to Accommodate',i:'🕒',l:{1:'I apologize for the delay in my update and for being unable to accommodate your request.',2:'I apologize for the delay in my response and for being unable to accommodate your request.'}},
 {k:'OP-CON',n:'Confusion',i:'❓',l:{1:'I apologize for the confusion regarding this matter.',2:'I apologize for the confusion regarding my previous email.'}}]},
closing:{title:'Closing Spiels',desc:'All closing categories are visible. Click any line to copy your closing spiel. Select several category chips to open them side by side.',append:false,cats:[
 {k:'CL-STY',n:'Survey + Thank You',i:'✅',l:{1:'We value your opinion. If you receive a survey, we would appreciate your time in completing it. Thank you for reaching out to FedEx.',2:'Your feedback helps us improve. If a survey is sent your way, we would be thankful for your response. Thank you for reaching out to FedEx.',3:'Should a survey arrive in your inbox, your feedback would be most welcome. Thank you for allowing us to assist you.'}},
 {k:'CL-SPA',n:'Survey + Patience',i:'❗',l:{1:'We would greatly appreciate your feedback if you receive a survey. Thank you for your patience throughout this matter.',2:'Thank you for your patience in this matter. If you receive a survey, we would be grateful for your feedback.',3:'We truly appreciate your patience. If a survey follows, your input will mean a lot to us.'}},
 {k:'CL-THK',n:'Thank You',i:'✅',l:{1:'Thank you for reaching out to FedEx.',2:'We appreciate your interest in FedEx.',3:'Thank you for getting in touch with FedEx Premier Support.',5:'It was our pleasure to assist you. Thank you for reaching out to FedEx.',6:'Thank you for allowing us to assist you. Have a great day.',7:'Your concern has been addressed. Thank you for contacting FedEx.'}},
 {k:'CL-PAT',n:'Patience',i:'❗',l:{1:'Thank you for your patience on this matter. We are glad we could assist you today.',2:'Your patience is appreciated. Thank you for choosing FedEx.',3:'Your understanding is greatly appreciated, thank you for allowing us to assist you.',4:'We sincerely thank you for your patience and understanding.',5:'Your patience throughout this matter is truly appreciated.',6:'Thank you for your continued patience and trust in our service.',7:'Your patience has been invaluable, thank you for allowing us to assist you.'}},
 {k:'CL-HRY',n:'Hear From You Soon',i:'🤝',l:{1:'I await your response with interest.',2:'I appreciate your time and hope to hear from you soon.',3:'Your reply will be greatly appreciated.',4:'I look forward to hearing from you.',5:'I hope to hear from you soon.',6:'I would appreciate a response at your convenience.',7:'I welcome your reply at your earliest convenience.'}}]}
};
let page='opening',favOnly=false,fav=new Set();const sel={opening:new Set(),closing:new Set()};
try{fav=new Set(JSON.parse(localStorage.getItem('spiels-fav')||'[]'))}catch(e){}
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const save=()=>{try{localStorage.setItem('spiels-fav',JSON.stringify([...fav]))}catch(e){}};
function toast(m){const t=$('#toast');t.textContent=m||'Copied!';t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1100)}
function copy(txt){
  const done=()=>toast('Copied!');
  const fb=()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();try{document.execCommand('copy')}catch(e){}a.remove();done()};
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,fb)}else fb();
}
function find(id){for(const p in DATA)for(const c of DATA[p].cats)for(const n in c.l)if(c.k+'-'+pad(n)===id)return c.l[n]}
function render(){
  const d=DATA[page];$('#title').textContent=d.title;$('#desc').textContent=d.desc;
  const chips=[['FAV','★ Favorites'],...d.cats.map(c=>[c.k,c.n])];
  const sc=$('#chips').scrollLeft;$('#chips').innerHTML=chips.map(c=>`<button class="chip ${(c[0]==='FAV'?favOnly:sel[page].has(c[0]))?'on':''}" data-c="${c[0]}">${c[1]}</button>`).join('')+'<button class="chip clr" data-c="ALL">Clear Filter</button>';$('#chips').scrollLeft=sc;
  const q=$('#q').value.trim().toLowerCase();let out='';
  d.cats.forEach(c=>{
    if(sel[page].size&&!sel[page].has(c.k))return;
    const rows=Object.keys(c.l).map(n=>({id:c.k+'-'+pad(n),t:c.l[n]}))
      .filter(r=>(!favOnly||fav.has(r.id))&&(!q||r.t.toLowerCase().includes(q)||c.n.toLowerCase().includes(q)));
    if(!rows.length)return;
    out+=`<div class="cat"><h3>${c.i} ${c.n}</h3>`+rows.map(r=>`<div class="line" data-id="${r.id}"><div class="head"><span class="id">${r.id}</span><button class="b star ${fav.has(r.id)?'on':''}" data-a="star">★</button><span class="sp"></span>${d.append?'<button class="b" data-a="app">Append</button>':''}<button class="b" data-a="para">New Paragraph</button><button class="b" data-a="view">View</button></div><div class="txt" data-a="copy"></div></div>`).join('')+`</div>`;
  });
  $('#cols').innerHTML=out||'<div class="empty">No spiels found.</div>';
  document.querySelectorAll('.line').forEach(el=>{el.querySelector('.txt').textContent=find(el.dataset.id)});
}
document.addEventListener('click',e=>{
  const nav=e.target.closest('.nav');if(nav){page=nav.dataset.p;$('#q').value='';document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n===nav));return render()}
  const ch=e.target.closest('.chip');if(ch){const c=ch.dataset.c;if(c==='ALL'){$('#q').value='';favOnly=false;sel[page].clear()}else if(c==='FAV')favOnly=!favOnly;else{const S=sel[page];S.has(c)?S.delete(c):S.add(c)}return render()}
  const a=e.target.closest('[data-a]');if(!a)return;
  const id=a.closest('.line').dataset.id,t=find(id),dr=$('#draft');
  if(a.dataset.a==='copy')copy(t);
  else if(a.dataset.a==='star'){fav.has(id)?fav.delete(id):fav.add(id);save();render()}
  else if(a.dataset.a==='app'){dr.value+=(dr.value&&!/\s$/.test(dr.value)?' ':'')+t;toast('Appended')}
  else if(a.dataset.a==='para'){dr.value+=(dr.value?'\n\n':'')+t;toast('Added paragraph')}
  else if(a.dataset.a==='view'){$('#mid').textContent=id;$('#mtxt').textContent=t;$('#modal').classList.add('show')}
});
$('#q').addEventListener('input',render);
$('#cpd').onclick=()=>$('#draft').value?copy($('#draft').value):toast('Draft is empty');
$('#clr').onclick=()=>{$('#draft').value=''};
$('#mcopy').onclick=()=>copy($('#mtxt').textContent);
$('#mclose').onclick=()=>$('#modal').classList.remove('show');
$('#modal').onclick=e=>{if(e.target.id==='modal')$('#modal').classList.remove('show')};
const tog=$('#tog');tog.onclick=()=>{document.body.classList.toggle('col');tog.textContent=document.body.classList.contains('col')?'»':'«'};
if(innerWidth<760){document.body.classList.add('col');tog.textContent='»'}
render();
</script>
</body>
</html>
